<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 1200 480" width="1200" height="480" role="img" aria-label="cursor, rojo and github sync banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbe4f4"/>
      <stop offset="0.5" stop-color="#ece4ff"/>
      <stop offset="1" stop-color="#dff3ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fff6fb"/>
    </linearGradient>
    <g id="star">
      <path d="M0,-10 L2.6,-2.6 L10,0 L2.6,2.6 L0,10 L-2.6,2.6 L-10,0 L-2.6,-2.6 Z"/>
    </g>
    <g id="sparkle">
      <circle r="3"/>
    </g>
  </defs>

  <!-- background -->
  <rect y="-60" width="1200" height="480" rx="28" fill="url(#sky)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="120" cy="300" rx="90" ry="34"/>
    <ellipse cx="190" cy="285" rx="60" ry="38"/>
    <ellipse cx="1060" cy="70" rx="80" ry="28"/>
    <ellipse cx="1120" cy="58" rx="54" ry="32"/>
    <ellipse cx="1090" cy="310" rx="70" ry="24"/>
  </g>

  <!-- stars -->
  <g fill="#f9a8d4">
    <use href="#star" x="80" y="60" transform="scale(1)"/>
    <use href="#star" x="1000" y="250"/>
    <use href="#star" x="640" y="40"/>
  </g>
  <g fill="#c4b5fd">
    <use href="#star" x="300" y="44"/>
    <use href="#star" x="900" y="160"/>
    <use href="#star" x="40" y="190"/>
  </g>
  <g fill="#fde68a">
    <use href="#star" x="1150" y="190"/>
    <use href="#star" x="470" y="320"/>
  </g>
  <g fill="#7dd3fc" opacity="0.8">
    <use href="#sparkle" x="230" y="120"/>
    <use href="#sparkle" x="960" y="110"/>
    <use href="#sparkle" x="760" y="320"/>
    <use href="#sparkle" x="380" y="80"/>
  </g>

  <!-- title -->
  <text x="600" y="92" text-anchor="middle" font-family="'Nunito','Quicksand','Arial Rounded MT Bold',system-ui,sans-serif" font-size="44" font-weight="800" fill="#6d28d9">technical musings</text>
  <text x="600" y="130" text-anchor="middle" font-family="'Nunito','Quicksand',system-ui,sans-serif" font-size="22" font-weight="600" fill="#db2777">how i taught roblox studio to talk to git</text>

  <!-- pipeline cards -->
  <g font-family="'Nunito','Quicksand',system-ui,sans-serif" text-anchor="middle">
    <!-- card 1: editor -->
    <rect x="150" y="170" width="190" height="130" rx="22" fill="url(#card)" stroke="#d8b4fe" stroke-width="3"/>
    <rect x="200" y="192" width="90" height="58" rx="10" fill="#f3e8ff" stroke="#c084fc" stroke-width="2"/>
    <rect x="212" y="206" width="40" height="5" rx="2.5" fill="#c084fc"/>
    <rect x="212" y="218" width="62" height="5" rx="2.5" fill="#f9a8d4"/>
    <rect x="222" y="230" width="34" height="5" rx="2.5" fill="#7dd3fc"/>
    <text x="245" y="284" font-size="20" font-weight="800" fill="#7c3aed">cursor</text>

    <!-- card 2: repo -->
    <rect x="390" y="170" width="190" height="130" rx="22" fill="url(#card)" stroke="#fbcfe8" stroke-width="3"/>
    <path d="M440 200 h30 l8 9 h42 a6 6 0 0 1 6 6 v34 a6 6 0 0 1 -6 6 h-80 a6 6 0 0 1 -6 -6 v-43 a6 6 0 0 1 6 -6 z" fill="#ffe4ef" stroke="#f472b6" stroke-width="2"/>
    <path d="M485 236 c-6 -8 -18 -2 -12 6 l12 10 l12 -10 c6 -8 -6 -14 -12 -6 z" fill="#f472b6"/>
    <text x="485" y="284" font-size="20" font-weight="800" fill="#db2777">github</text>

    <!-- card 3: bridge -->
    <rect x="630" y="170" width="190" height="130" rx="22" fill="url(#card)" stroke="#fde68a" stroke-width="3"/>
    <path d="M665 245 q60 -55 120 0" fill="none" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
    <line x1="660" y1="245" x2="790" y2="245" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    <line x1="695" y1="245" x2="695" y2="222" stroke="#fbbf24" stroke-width="3"/>
    <line x1="725" y1="245" x2="725" y2="215" stroke="#fbbf24" stroke-width="3"/>
    <line x1="755" y1="245" x2="755" y2="222" stroke="#fbbf24" stroke-width="3"/>
    <text x="725" y="284" font-size="20" font-weight="800" fill="#b45309">rojo</text>

    <!-- card 4: game -->
    <rect x="870" y="170" width="190" height="130" rx="22" fill="url(#card)" stroke="#bbf7d0" stroke-width="3"/>
    <rect x="915" y="203" width="100" height="50" rx="25" fill="#dcfce7" stroke="#4ade80" stroke-width="2.5"/>
    <rect x="935" y="224" width="20" height="6" rx="3" fill="#22c55e"/>
    <rect x="942" y="217" width="6" height="20" rx="3" fill="#22c55e"/>
    <circle cx="988" cy="220" r="5" fill="#f472b6"/>
    <circle cx="1000" cy="233" r="5" fill="#a78bfa"/>
    <text x="965" y="284" font-size="20" font-weight="800" fill="#15803d">studio</text>
  </g>

  <!-- connectors -->
  <g fill="#e879f9">
    <path d="M352 235 c6 -8 16 -2 10 6 l-10 8 l-10 -8 c-6 -8 4 -14 10 -6 z" transform="translate(13 -6)"/>
    <path d="M592 235 c6 -8 16 -2 10 6 l-10 8 l-10 -8 c-6 -8 4 -14 10 -6 z" transform="translate(13 -6)"/>
    <path d="M832 235 c6 -8 16 -2 10 6 l-10 8 l-10 -8 c-6 -8 4 -14 10 -6 z" transform="translate(13 -6)"/>
  </g>

  <!-- little face -->
  <g transform="translate(600 334)">
    <text text-anchor="middle" font-family="'Nunito',system-ui,sans-serif" font-size="18" font-weight="700" fill="#a78bfa">by mari · october 2026</text>
  </g>
</svg>
